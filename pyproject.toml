[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pytikz"
version = "0.1.0"
description = "Write Python, get beautiful TikZ: diagrams for machine learning and mathematics."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]
keywords = ["tikz", "latex", "diagrams", "machine learning", "plotting", "pgf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.optional-dependencies]
png = ["pypdfium2>=4"]   # PNG output without poppler/Ghostscript
dev = ["pytest>=7", "pypdfium2>=4", "pillow", "ruff>=0.17"]

[project.scripts]
pytikz = "pytikz.cli:main"

[tool.setuptools.packages.find]
include = ["pytikz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["latex: needs a LaTeX installation (pdflatex)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pyflakes, pycodestyle errors and bugbear: correctness, not style
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# math notation in the examples: O (origin, circumcentre), I (incentre)
"examples/**" = ["E741"]
