# Continuous integration for pytikz:
#   lint    - ruff
#   test    - unit tests on every supported Python (no LaTeX needed)
#   render  - installs LaTeX with `pytikz setup` on Linux, macOS and Windows,
#             then runs the whole test suite, which compiles every example
#   build   - builds the sdist and wheel, checks them and installs the wheel
name: Python package

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install "ruff==0.17.0"
      - name: Run ruff
        run: ruff check --output-format=github .

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # Python 3.9 builds are only published for Ubuntu 24.04 and older.
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pytikz with the test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -m "not latex"

  render:
    name: Rendering with LaTeX (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pytikz
        run: python -m pip install -e ".[dev]"
      - name: Install LaTeX (TinyTeX) with pytikz setup
        run: pytikz setup --yes --no-path
      - name: Check the toolchain
        run: pytikz doctor
      - name: Full test suite, compiling every example
        run: python -m pytest
      - name: Render the example gallery
        if: runner.os == 'Linux'
        run: python examples/build_all.py
      - name: Upload the gallery
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: example-gallery
          path: examples/output/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build the sdist and the wheel
        run: python -m build
      - name: Check the package metadata
        run: python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-test/bin/pytikz" --version
          "$RUNNER_TEMP/wheel-test/bin/python" -c "import pytikz as tz; pic = tz.Picture(); pic.node('x', style='block'); print(pic.tikz())"
      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
